
name: Build zHomes

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract plugin source
        run: unzip -q zHomes-source.zip -d .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: zHomes/pom.xml

      - name: Build plugin
        run: mvn -B -f zHomes/pom.xml clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: zHomes-plugin
          path: zHomes/target/*.jar
